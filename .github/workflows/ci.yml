name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: barrier_report
          POSTGRES_USER: local_user
          POSTGRES_PASSWORD: local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U local_user -d barrier_report"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_PROFILES_ACTIVE: test
      JWT_SECRET: test-jwt-secret-key-test-jwt-secret-key-test-jwt-secret-key
      JWT_ACCESS_TOKEN_VALIDITY: 3600000

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build